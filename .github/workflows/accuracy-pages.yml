name: Publish accuracy reports
on:
  workflow_run:
    workflows: [Evaluation]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published release tag to recover/backfill; leave empty for main'
        required: false
        default: ''
        type: string
permissions:
  contents: read
# Preserve queued publications instead of replacing pending main/release runs.
concurrency:
  group: accuracy-pages
  queue: max
jobs:
  resolve:
    if: github.event_name != 'workflow_run' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      target: ${{ steps.target.outputs.commit }}
      route: ${{ steps.route.outputs.route }}
      base: ${{ steps.route.outputs.base }}
    steps:
      - name: Trusted publishing tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: tools
          persist-credentials: false
      - name: Resolve published release or main target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/scripts/publish_accuracy.py --resolve-target "$RUNNER_TEMP/accuracy-target.json"
      - name: Exact release or main source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Choose validated retained, parallel, or legacy evidence path
        id: route
        run: |
          git clone --depth 1 --branch gh-pages "https://github.com/$GITHUB_REPOSITORY.git" pages
          python3 tools/scripts/accuracy_backfill.py route --source source --pages pages \
            --target "$RUNNER_TEMP/accuracy-target.json" --output resolved
      - uses: actions/upload-artifact@v4
        with:
          name: accuracy-backfill-resolved-${{ github.run_attempt }}
          path: resolved/
          retention-days: 30
          if-no-files-found: error
  parallel:
    name: Backfill accuracy
    needs: resolve
    if: needs.resolve.outputs.route == 'parallel'
    uses: ./.github/workflows/accuracy-evaluate.yml
    with:
      target: ${{ needs.resolve.outputs.target }}
      base: ${{ needs.resolve.outputs.base }}
  legacy:
    needs: resolve
    if: needs.resolve.outputs.route == 'legacy'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.target }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - name: Execute the target's historical small-cohort protocol
        env:
          TARGET: ${{ needs.resolve.outputs.target }}
          BASE: ${{ needs.resolve.outputs.base }}
        run: |
          mkdir -p raw
          if [ -x source/scripts/usertime-ci.sh ]; then
            (cd source && scripts/usertime-ci.sh "$BASE" "$GITHUB_WORKSPACE/raw")
          else
            python3 tools/scripts/accuracy_site.py failure --output raw --commit "$TARGET" --message 'This target predates whole-program accuracy support.'
            exit 1
          fi
      - name: Package historical evidence, including failures
        if: always()
        env:
          TARGET: ${{ needs.resolve.outputs.target }}
        run: |
          if [ ! -f raw/report.json ]; then
            python3 tools/scripts/accuracy_site.py failure --output raw --commit "$TARGET" --message 'Historical accuracy build failed before producing a report; inspect workflow logs.'
          fi
          python3 tools/scripts/accuracy_site.py bundle --report raw/report.json --source source --output evidence --commit "$TARGET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-backfill-legacy-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
  build:
    name: Package exact-target publication evidence
    permissions:
      contents: read
      actions: read
    needs: [resolve, parallel, legacy]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.target }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Package only the selected route; preserve incomplete diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.resolve.outputs.target }}
          ROUTE_STATUS: ${{ needs.resolve.outputs.route == 'parallel' && needs.parallel.result || needs.resolve.outputs.route == 'legacy' && needs.legacy.result || 'success' }}
        run: |
          python3 tools/scripts/accuracy_backfill.py package --source source \
            --resolved resolved --evidence selected --output evidence --commit "$TARGET" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --route-status "$ROUTE_STATUS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-accuracy-evidence-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: [build]
    if: always() && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Publish branch and request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_CONCLUSION: ${{ needs.build.result }}
        run: |
          gh auth setup-git
          python3 scripts/publish_accuracy.py --bundle evidence --build-conclusion "$BUILD_CONCLUSION"
