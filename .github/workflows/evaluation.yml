name: Evaluation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evaluation-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  static:
    name: Linux static and manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - run: python3 scripts/workload_contract_test.py
      - run: python3 scripts/accuracy_site_test.py
      - run: scripts/evaluation-ci.sh static
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manifest
          path: evaluation-results/
  tests:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux short regression
            os: ubuntu-24.04
            tier: short
          - name: Linux full regression
            os: ubuntu-24.04
            tier: full
          - name: macOS compatibility
            os: macos-15
            tier: short
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - run: go build ./cmd/...
      - run: scripts/evaluation-ci.sh ${{ matrix.tier }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.os }}-${{ matrix.tier }}
          path: evaluation-results/
  elf-functional:
    name: Linux ELF functional and QEMU differential
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - run: sudo apt-get update && sudo apt-get install -y qemu-user
      - run: |
          mkdir -p evaluation-results
          go build -o /tmp/poros ./cmd/poros
          go test -count=1 ./pkg/loader ./pkg/linuxuser ./pkg/emu ./cmd/poros
          python3 scripts/elf-differential_test.py
          python3 scripts/elf-differential.py --require-clean --poros /tmp/poros --output evaluation-results/elf-differential.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elf-functional-differential
          path: evaluation-results/
  macho-native-bringup:
    name: Mach-O native correctness and runtime bring-up
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - run: |
          test "$(uname -m)" = arm64
          go build -o /tmp/poros ./cmd/poros
          go test -count=1 ./pkg/loader ./pkg/usermem ./pkg/darwinuser ./cmd/poros
          python3 scripts/macho-native.py --poros /tmp/poros --output evaluation-results/macho-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macho-native-bringup
          path: evaluation-results/macho-native.json
  user-time-accuracy:
    name: User-time accuracy report
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - name: Compare frozen references against base and head
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/usertime-ci.sh "${BASE_REVISION:-HEAD^}"
      - name: Build browsable evidence bundle
        if: always()
        env:
          REPORT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ ! -f evaluation-results/usertime/report.json ]; then
            python3 scripts/accuracy_site.py failure --output evaluation-results/usertime --commit "$REPORT_COMMIT" --message 'Accuracy job failed before producing a report; inspect its logs.'
          fi
          python3 scripts/accuracy_site.py bundle --report evaluation-results/usertime/report.json --output evaluation-results/accuracy-bundle --commit "$REPORT_COMMIT"
          cat evaluation-results/usertime/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-time-accuracy-${{ github.run_attempt }}
          path: evaluation-results/accuracy-bundle/
          retention-days: 30
          if-no-files-found: error
  diagnostics:
    name: Extended CLI diagnostics
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - run: |
          mkdir -p evaluation-results
          go run ./cmd/poros run --all >evaluation-results/cli-comparison.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-cli
          path: evaluation-results/
