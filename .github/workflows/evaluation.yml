name: Evaluation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evaluation-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  static:
    name: Linux static and manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - run: python3 scripts/benchmark-differential_test.py
      - run: python3 scripts/math-oracle.py --check
      - run: python3 scripts/workload_contract_test.py
      - run: python3 scripts/usertime_test.py
      - run: python3 scripts/performance_reference_test.py
      - run: python3 scripts/macho_reference_test.py
      - run: python3 scripts/accuracy_backfill_test.py
      - run: python3 scripts/accuracy_site_test.py
      - run: python3 scripts/accuracy_live_test.py
      - run: python3 scripts/compute_usertime_test.py
      - run: python3 scripts/accuracy_parallel_test.py
      - run: python3 scripts/frontend_microbenchmark_test.py
      - run: python3 scripts/throughput_microbenchmark_test.py
      - run: python3 scripts/forwarding_microbenchmark_test.py
      - run: python3 scripts/scheduling_microbenchmark_test.py
      - run: python3 scripts/model_profiles_test.py
      - run: python3 scripts/merged_main_pr_test.py
      - run: scripts/evaluation-ci.sh static
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manifest
          path: evaluation-results/
  tests:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux short regression
            os: ubuntu-24.04
            tier: short
          - name: Linux full regression
            os: ubuntu-24.04
            tier: full
          - name: macOS compatibility
            os: macos-15
            tier: short
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - run: go build ./cmd/...
      - run: scripts/evaluation-ci.sh ${{ matrix.tier }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.os }}-${{ matrix.tier }}
          path: evaluation-results/
  elf-functional:
    name: Linux ELF functional and QEMU differential
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - run: sudo apt-get update && sudo apt-get install -y qemu-user
      - run: |
          mkdir -p evaluation-results
          go build -o /tmp/poros ./cmd/poros
          go test -count=1 ./pkg/loader ./pkg/linuxuser ./pkg/emu ./cmd/poros
          go test -count=1 -run '^TestStreamclusterRepeatELF$' ./pkg/elfsim
          python3 scripts/throughput_microbenchmark.py smoke --poros /tmp/poros
          python3 scripts/forwarding_microbenchmark.py smoke --poros /tmp/poros
          python3 scripts/scheduling_microbenchmark.py smoke --poros /tmp/poros
          python3 scripts/elf-differential_test.py
          python3 scripts/elf-differential.py --require-clean --poros /tmp/poros --output evaluation-results/elf-differential.json
          python3 scripts/benchmark-differential.py --require-clean --poros /tmp/poros --output evaluation-results/benchmark-differential.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elf-functional-differential
          path: evaluation-results/
  merged-main-pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      merged: ${{ steps.pr.outputs.merged }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/merged_main_pr.py "$GITHUB_REPOSITORY" "$GITHUB_SHA"
  accuracy:
    name: Accuracy
    needs: merged-main-pr
    if: needs.merged-main-pr.outputs.merged == 'true'
    uses: ./.github/workflows/accuracy-evaluate.yml
    with:
      target: ${{ github.sha }}
      base: ${{ github.event.before }}
  diagnostics:
    name: Extended CLI diagnostics
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - run: |
          mkdir -p evaluation-results
          go run ./cmd/poros run --all --case 3 >evaluation-results/cli-results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-cli
          path: evaluation-results/
